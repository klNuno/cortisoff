name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the only version anyone sees, and the running app compares the
  # feed against the version compiled into it. A tag that disagrees with the
  # workspace version would make every install update to itself forever.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      # Before four builds, not after them.
      - name: Check the signing secrets are present
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "::error::MINISIGN_SECRET_KEY or MINISIGN_PASSWORD is missing. Updates cannot be signed."
            exit 1
          fi
          # An ad hoc bundle would carry a new designated requirement, and
          # every macOS permission grant would silently stop matching.
          if [ -z "$MACOS_SIGNING_P12" ] || [ -z "$MACOS_SIGNING_PASSWORD" ]; then
            echo "::error::MACOS_SIGNING_P12 or MACOS_SIGNING_PASSWORD is missing. The macOS app cannot be signed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the workspace version
        id: check
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag '$tag'. Expected vX.Y.Z"
            exit 1
          fi
          version="${tag#v}"
          for package in cortisoff-app cortisoff-cli cortisoff-update; do
            found=$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg p "$package" '.packages[] | select(.name == $p) | .version')
            if [ "$found" != "$version" ]; then
              echo "::error::Version mismatch: tag $version, $package $found"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.key }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - key: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: .exe
          - key: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - key: darwin-aarch64
            os: macos-26
            target: aarch64-apple-darwin
            ext: ""
          # Built natively: LuaJIT's build runs a host tool that has to match
          # the target, which makes a cross build from arm64 fragile.
          - key: darwin-x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p cortisoff-app -p cortisoff-cli

      # The bare executables are the artifacts, so the signature covers
      # exactly what runs.
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          out="target/${{ matrix.target }}/release"
          cp "$out/cortisoff${{ matrix.ext }}" "dist/cortisoff-${{ matrix.key }}${{ matrix.ext }}"
          cp "$out/cortisoff-cli${{ matrix.ext }}" "dist/cortisoff-cli-${{ matrix.key }}${{ matrix.ext }}"
          ls -la dist

      - name: Import the macOS signing identity
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: sh packaging/macos/keychain.sh import

      # macOS also gets Cortisoff.app, zipped and signed with the release
      # certificate. An installed bundle updates from that zip, whole. The
      # bare executables stay for v0.2.0, which installed a bare executable
      # and updates from the bare keys until it has moved into the bundle.
      - name: Bundle the macOS app
        if: runner.os == 'macOS'
        env:
          KEY: ${{ matrix.key }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: sh packaging/macos/bundle.sh "target/$TARGET/release" "$VERSION" "dist/cortisoff-$KEY.zip"

      - name: Remove the macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: sh packaging/macos/keychain.sh remove

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.key }}
          if-no-files-found: error
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The signer is an example of the library itself, so a release is
      # signed by the code that checks it, and every signature is verified
      # against the committed update.pub before anything is published.
      - name: Build the signer
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked -p cortisoff-update --example sign

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          target/release/examples/sign "$VERSION" \
            dist/cortisoff-windows-x86_64.exe \
            dist/cortisoff-linux-x86_64 \
            dist/cortisoff-darwin-aarch64 \
            dist/cortisoff-darwin-x86_64 \
            dist/cortisoff-darwin-aarch64.zip \
            dist/cortisoff-darwin-x86_64.zip \
            dist/cortisoff-cli-windows-x86_64.exe \
            dist/cortisoff-cli-linux-x86_64

      - name: Write the release notes
        run: |
          tag="$GITHUB_REF_NAME"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          range="$tag"
          if [ -n "$previous" ]; then
            range="$previous..$tag"
          fi
          git log --no-merges --pretty='- %s' "$range" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "- No changes listed." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      # The feed cortisoff-update reads, in the Tauri updater's shape: each
      # signature is the base64 of its .sig file. A macOS bundle reads its
      # `-app` key, the zipped Cortisoff.app; the bare darwin keys stay for
      # v0.2.0's bare executable. Windows and Linux read their `-cli` key
      # too when a client is installed beside the app, and update it with it.
      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          platforms='{}'
          for key in windows-x86_64 linux-x86_64 darwin-aarch64 darwin-x86_64 \
            darwin-aarch64-app darwin-x86_64-app \
            windows-x86_64-cli linux-x86_64-cli; do
            case "$key" in
              windows-*-cli) name="cortisoff-cli-${key%-cli}.exe" ;;
              *-cli) name="cortisoff-cli-${key%-cli}" ;;
              windows-*) name="cortisoff-$key.exe" ;;
              *-app) name="cortisoff-${key%-app}.zip" ;;
              *) name="cortisoff-$key" ;;
            esac
            if [ ! -s "dist/$name.sig" ]; then
              echo "::error::Missing signature for $name"
              exit 1
            fi
            signature=$(base64 -w0 "dist/$name.sig")
            platforms=$(jq -n \
              --argjson platforms "$platforms" \
              --arg key "$key" \
              --arg signature "$signature" \
              --arg url "https://github.com/$REPO/releases/download/$TAG/$name" \
              '$platforms + { ($key): { signature: $signature, url: $url } }')
          done
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes RELEASE_NOTES.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > dist/latest.json
          cat dist/latest.json

      - name: Checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Draft, so a release is read before any installed copy updates to it:
      # releases/latest/download/latest.json only resolves once it is
      # published.
      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          body_path: RELEASE_NOTES.md
          files: dist/*
