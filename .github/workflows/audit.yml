name: Audit

# Known vulnerabilities in the locked dependencies. Weekly, because an
# advisory can be published against a lock file nobody touched, and on any
# change to the lock file, which is where Dependabot's updates land.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
