name: Audit

# Known vulnerabilities in the locked dependencies. Weekly, because an
# advisory can be published against a lock file nobody touched, and on any
# change to the lock file, which is where Dependabot's updates land.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
