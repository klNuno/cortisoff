version: 2
# The workflow actions and the Cargo dependencies share one monthly pull
# request, so a month of updates costs one CI run instead of several.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: monthly
    patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: monthly
    patterns: ["*"]
