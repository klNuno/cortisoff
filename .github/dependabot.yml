version: 2
# The workflow actions and the Cargo dependencies share one weekly pull
# request, so a week of updates costs one CI run instead of several.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
