[package]
name = "cortisoff-win"
description = "The Windows half: event sources, the message pump, the actuators, and the named-pipe transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cortisoff-host = { path = "../cortisoff-host" }
cortisoff-ipc = { path = "../cortisoff-ipc" }

# Only on Windows, so `cargo check --target x86_64-unknown-linux-gnu
# --workspace` stays the portability proof it is meant to be. The crate
# compiles to nothing at all elsewhere.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_ColorSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
