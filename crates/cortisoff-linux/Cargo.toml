[package]
name = "cortisoff-linux"
description = "The Linux half: an X11 host, its event sources, the RandR actuators and the desktop services."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cortisoff-host = { path = "../cortisoff-host" }

# Only on Linux, so the crate compiles to nothing on Windows and the
# workspace check there never pulls an X11 stack. No C library is linked at
# build time: x11rb speaks the protocol over the socket itself and rustix
# makes its system calls directly.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false, features = [
    "randr",
    "screensaver",
    "xinput",
    "xtest",
] }
rustix = { version = "1", default-features = false, features = [
    "std",
    "event",
    "param",
    "pipe",
    "process",
    "time",
] }
# `localtime_r` only. rustix has no time zone database access.
libc = "0.2"
# The session lock (logind), idle (Mutter) and GNOME's Night Light under
# Wayland. Pure Rust over the bus socket, its blocking API on its own small
# executor: no libdbus and no tokio. The window already links it through
# accesskit, so the binary gains little.
zbus = { version = "5", default-features = false, features = [
    "blocking-api",
    "async-io",
] }
