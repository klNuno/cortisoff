[package]
name = "cortisoff-ui"
description = "What the window draws: the theme, the widgets, and each plugin's own page run from its Lua."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cortisoff-host = { path = "../cortisoff-host" }
cortisoff-ipc = { path = "../cortisoff-ipc" }
cortisoff-runtime = { path = "../cortisoff-runtime" }
egui = { version = "0.36", default-features = false }
mlua = { version = "0.12", features = ["luajit", "vendored", "serialize"] }
serde_json = { workspace = true }

[dev-dependencies]
# egui ships no font without `default_fonts`; tests run where Segoe UI is not.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
# The page captures, behind #[ignore]: they need a GPU.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
