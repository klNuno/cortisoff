[package]
name = "cortisoff-daemon"
description = "The daemon: the supervisor that runs plugins and owns the hardware, and the loop that picks a platform."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cortisoff-core = { path = "../cortisoff-core" }
cortisoff-host = { path = "../cortisoff-host" }
cortisoff-ipc = { path = "../cortisoff-ipc" }
cortisoff-runtime = { path = "../cortisoff-runtime" }
serde = { workspace = true }
serde_json = { workspace = true }

# `run` is the one place that picks a platform. Everything else in this crate
# stays free of these, which is what keeps its tests runnable anywhere.
[target.'cfg(windows)'.dependencies]
cortisoff-win = { path = "../cortisoff-win" }

[target.'cfg(unix)'.dependencies]
cortisoff-unix = { path = "../cortisoff-unix" }

[target.'cfg(target_os = "macos")'.dependencies]
cortisoff-mac = { path = "../cortisoff-mac" }

[target.'cfg(target_os = "linux")'.dependencies]
cortisoff-linux = { path = "../cortisoff-linux" }

[dev-dependencies]
cortisoff-host = { path = "../cortisoff-host", features = ["test-util"] }
