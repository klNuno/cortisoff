# Every rule cortisoff ships, written the way you would write your own.
#
# A rule is a predicate, not a script. While its `when` holds, it owns what it
# sets; the moment it stops holding, everything goes back on its own. There is
# no undo section because there is nothing to undo.
#
# Every key inside `when` has to hold at once. `any` and `not` are there for
# the rest.

[[rule]]
name = "vibrance and refresh rate in competitive games"
# Beats the schedule rules below, which sit at the default priority of 0.
priority = 100
when.app = ["valorant.exe", "cs2.exe"]
set.display.vibrance = 100
# "@240" keeps the resolution you are on and changes refresh only.
# "2560x1440@240" sets both. 59.94 Hz is written "1920x1080@59.94".
set.display.mode = "@240"

[[rule]]
name = "blue light at night"
# End exclusive, and it crosses midnight because the start is after the end.
when.between = "20:00-07:00"
# A film or a game filling the screen keeps its colours, and so does a
# maximised window. Add `when.not.app = ["vlc.exe"]` to spare an application
# whatever its window does.
when.not.maximized = true
set.display.color_temp = 3200
# Fades rather than switching: one minute down to 3200 K at 20:00, and one
# minute back, done by 07:00. With no `transition.from` the fade starts from
# what the screen shows, 6600 K on an untouched monitor.
transition.duration = "1m"
transition.offset = 0

[[rule]]
name = "pause the wallpaper when nobody is there"
when.any = [{ idle = true }, { locked = true }]
set.wallpaper.playback = false

[[rule]]
name = "dim the colours on battery"
# A rule with no `when` would always hold. This one holds whenever the laptop
# is unplugged, and loses to anything above it.
priority = -100
when.on_battery = true
set.display.vibrance = 30

# Conditions you can use inside `when`:
#
#   app         "chrome.exe", or a list. Matched on the file name, any case.
#   title       substring of the window title, any case.
#   fullscreen  true when an exclusive fullscreen application owns the screen.
#   maximized   true when the focused window fills its monitor: maximised,
#               borderless fullscreen or exclusive fullscreen. What most rules
#               mean by "an app is fullscreen".
#   idle        true when nobody has touched the machine.
#   locked      true when the session is locked.
#   on_battery  true when running on battery.
#   audio       true when something is playing sound.
#   between     "20:00-07:00", or a list of windows.
#   any         a list of condition tables, any one of which may hold.
#   not         a condition table that must not hold.
#
# A rule with a `between` window can fade instead of switching:
#
#   transition.duration   "40m", "1h30m". How long one fade takes.
#   transition.offset     0 to 100. At 0 both fades sit inside the window,
#                         at 100 both sit outside it, at 50 on its edges.
#   transition.from.<cap> where the value starts, outside the window. Left
#                         out, a number starts from what the screen shows
#                         right now, and anything else switches.
#
# A rule naming a capability this machine does not have still loads. It is
# listed as unsupported by `cortisoff doctor` and never claims anything.
