[package]
name = "cortisoff-app"
description = "The cortisoff dashboard. An IPC client with a window, and nothing else."
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/klNuno/cortisoff"

# Deliberately outside the workspace, exactly like `probe/`.
#
# Tauri pulls webkit2gtk on Linux, so a workspace member would break
# `cargo check --workspace --target x86_64-unknown-linux-gnu`, and that command
# is the proof that the core is portable. The dashboard is a client: it links
# the protocol and the transport, never the daemon.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cortisoff-host = { path = "../../crates/cortisoff-host" }
cortisoff-ipc = { path = "../../crates/cortisoff-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Desktop only, and this application is desktop only, but the plugins
# themselves refuse to build for mobile targets.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
cortisoff-win = { path = "../../crates/cortisoff-win" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
